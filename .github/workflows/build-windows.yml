name: Build Windows Executable

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-freeglut
            mingw-w64-ucrt-x86_64-eigen3

      - name: Build Windows executables
        run: |
          mkdir -p build dist

          g++ -std=c++11 -O2 -DFREEGLUT_STATIC -static -static-libstdc++ -static-libgcc \
            -o build/task1.exe LAB1/1/main.cpp /ucrt64/lib/libfreeglut.a \
            -lopengl32 -lglu32 -lgdi32 -lwinmm

          g++ -std=c++11 -O2 -DFREEGLUT_STATIC -static -static-libstdc++ -static-libgcc \
            -o build/task2.exe LAB1/2/main.cpp /ucrt64/lib/libfreeglut.a \
            -lopengl32 -lglu32 -lgdi32 -lwinmm

          g++ -std=c++11 -O2 -DFREEGLUT_STATIC -static -static-libstdc++ -static-libgcc \
            -o build/task3.exe LAB1/3/main.cpp /ucrt64/lib/libfreeglut.a \
            -lopengl32 -lglu32 -lgdi32 -lwinmm

          g++ -std=c++17 -O2 -DFREEGLUT_STATIC -static -static-libstdc++ -static-libgcc \
            -I/ucrt64/include/eigen3 \
            -o build/task1_6.exe LAB4/exp4_task1_6.cpp /ucrt64/lib/libfreeglut.a \
            -lopengl32 -lglu32 -lgdi32 -lwinmm

          g++ -std=c++17 -O2 -DFREEGLUT_STATIC -static -static-libstdc++ -static-libgcc \
            -I/ucrt64/include/eigen3 \
            -o build/task1_7.exe LAB4/exp4_task1_7.cpp /ucrt64/lib/libfreeglut.a \
            -lopengl32 -lglu32 -lgdi32 -lwinmm

          g++ -std=c++17 -O2 -DFREEGLUT_STATIC -static -static-libstdc++ -static-libgcc \
            -I/ucrt64/include/eigen3 \
            -o build/task1_8.exe LAB4/exp4_task1_8.cpp /ucrt64/lib/libfreeglut.a \
            -lopengl32 -lglu32 -lgdi32 -lwinmm

          cp build/task1.exe dist/
          cp build/task2.exe dist/
          cp build/task3.exe dist/
          cp build/task1_6.exe dist/
          cp build/task1_7.exe dist/
          cp build/task1_8.exe dist/
          ls -la dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: dist/
          retention-days: 7
